<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub de Monitoramento do Portal</title>
  <script src="tema.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <aside class="rail" aria-label="Navegação">
    <div class="brand-mark" aria-hidden="true">C</div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <button class="rail-btn" id="themeBtn" type="button" title="Tema claro/escuro" aria-label="Alternar tema"></button>
      <button class="rail-btn" id="cfgBtn" type="button" title="Configurações" aria-label="Configurações"></button>
    </div>
  </aside>
  <div class="shell">
    <header class="bar">
      <div class="ttl"><h1 id="title">Hoje</h1><span id="sub" class="ctx"></span></div>
      <div class="seg" id="seg" role="group" aria-label="Setor"></div>
      <div class="pill-status" title="Dados de exemplo">
        <i class="dot-ok"></i><div><b>Dados de exemplo</b><small id="stamp"></small></div>
        <svg class="ring-mini" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
      </div>
      <button class="icon-btn" id="bell" type="button" aria-label="Alertas"></button>
      <label class="search"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Buscar empresa, CNPJ ou arquivo…" aria-label="Buscar"><kbd>Ctrl K</kbd></label>
      <button class="btn" id="refresh" type="button" disabled title="Coleta real chega na Fase 4">Atualizar coleta</button>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="hub.js"></script>
</body>
</html>
